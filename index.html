      const list = [...COMPANIES, ...extra];
      cs.innerHTML = list.map(comp=>`
        <div class="stat"><div class="sv">${byCompany[comp]||0}</div><div class="sl">${esc(comp)}</div></div>`).join("");
    }
    paintCards();
  };

  // buscador
  const si = $("#formSearch");
  if(si){
    si.addEventListener("input", e=>{ state.dashSearch = e.target.value; paintCards(); });
  }

  if(state.demo){
    let data={byForm:{}, byCompany:{}};
    try{ data = await dbCountByForm(); }catch(e){ console.warn(e); }
    paint(data);
  } else {
    // Carga inicial inmediata + suscripción en tiempo real
    let first = true;
    state.unsub.dashboard = subscribeCounts(data=>{
      paint(data);
      if(!first) flashLiveDot();
      first = false;
    });
    if(!state.unsub.dashboard){
      let data={byForm:{}, byCompany:{}}; try{ data = await dbCountByForm(); }catch(e){}
      paint(data);
    }
  }
}
</script>

<script>
/* ======================================================================
   RENDER: REGISTROS DE UN FORMULARIO
   ====================================================================== */
async function openForm(formId){
  const form = FORM_BY_ID[formId];
  if(!form || !canUseForm(form, state.user.rol)){
    toast("No tenés acceso a este formulario","warn");
    state.view="dashboard"; renderDashboard(); return;
  }
  state.currentForm = form;
  state.exitTab = "activas";
  state.view = "form:"+formId;
  const main = $("#main");
  main.innerHTML = `
    <button class="btn ghost sm" id="backDash" style="margin-bottom:16px">${ICON.arrow.replace('points="12 5 19 12 12 19"','points="12 19 5 12 12 5"').replace('x1="5" y1="12" x2="19"','x1="19" y1="12" x2="5"')} Volver a formularios</button>
    <div class="page-head">
      <h2><span class="fc-icon" style="width:40px;height:40px;border-radius:11px;background:${ACCENTS[form.accent]};display:inline-grid">${ICON[form.icon]||ICON.doc}</span> ${esc(form.title)} <span class="code-badge">${form.code}</span>${state.demo?'':'<span class="live-badge" id="liveBadge" title="Actualización en tiempo real"><span class="live-dot"></span> En vivo</span>'}</h2>
      <p>${esc(form.desc)} <br><b style="color:var(--ink-soft)">${esc(form.empresa)}</b> · ${esc(form.sistema)}</p>
      <div class="ph-logos"><img src="${LOGOS.byc}" alt="B&C Exportadores"><img src="${LOGOS.bc}" alt="Bajo Cero"></div>
    </div>
    ${form.instructions?`<div style="background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--emerald-l);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:13px;color:var(--ink-soft);line-height:1.5"><b>Instrucciones:</b> ${esc(form.instructions)}</div>`:''}
    <div class="toolbar">
      <div class="search-box">
        <span class="ico">${ICON.search}</span>
        <input id="recSearch" placeholder="Buscar por consecutivo, nombre, fecha…">
      </div>
      <button class="btn solid" id="newRec"${canCreateInForm(form, state.user.rol)?'':' style="display:none"'}>${ICON.plus} Nueva boleta</button>
    </div>
    <div id="recList"><div class="loader-wrap"><div class="spinner"></div><p>Cargando registros…</p></div></div>`;

  $("#backDash").onclick = ()=>{ stopRealtime(); state.view="dashboard"; renderDashboard(); };
  const newRecBtn = $("#newRec");
  if(newRecBtn) newRecBtn.onclick = ()=>{ if(canCreateInForm(form, state.user.rol)) openEditor(form, null); };
  $("#recSearch").addEventListener("input", e=>{ state.search=e.target.value.toLowerCase(); paintRecords(); });

  // Admin y Encargado necesitan los nombres de los creadores para la etiqueta
  if(hasFullAccess(state.user.rol)){ try{ await loadUserMap(); }catch(e){} }

  // Detener listeners previos antes de abrir este formulario
  stopRealtime();

  if(state.demo){
    // Modo demo: carga puntual; se refresca tras cada acción propia
    try{ state.records = await dbListRecords(formId); }
    catch(e){ console.error(e); state.records=[]; toast("No se pudieron cargar los registros","err"); }
    paintRecords();
  } else {
    // Tiempo real: la tabla se actualiza sola ante cualquier cambio
    let first = true;
    state.unsub.records = subscribeRecords(formId, arr=>{
      state.records = arr;
      // Solo repinta si seguimos en este formulario
      if(state.view === "form:"+formId){
        paintRecords();
        if(!first) flashLiveDot();
      }
      first = false;
    });
    if(!state.unsub.records){
      // fallback si por algún motivo no se pudo suscribir
      try{ state.records = await dbListRecords(formId); }catch(e){ state.records=[]; }
      paintRecords();
    }
  }
}

function paintRecords(){
  const form = state.currentForm;
  const cont = $("#recList");
  if(!cont) return;
  const q = state.search;
  const exitFlow = hasExitFlow(form);

  // Filtro por estado de salida (solo si el form usa exitFlow)
  let base = state.records;
  if(exitFlow){
    const tab = state.exitTab || "activas";
    base = state.records.filter(r=> tab==="salieron" ? !!(r.data&&r.data._salida) : !(r.data&&r.data._salida));
  }

  const rows = base.filter(r=>{
    if(!q) return true;
    const hay = JSON.stringify(r.data||{}).toLowerCase()+" "+(r.consecutivo||"").toLowerCase();
    return hay.includes(q);
  });

  // Barra de pestañas Activas / Ya salieron
  const tabsHtml = exitFlow ? `
    <div class="exit-tabs">
      <button class="exit-tab ${(state.exitTab||'activas')==='activas'?'active':''}" onclick="setExitTab('activas')">Activas</button>
      <button class="exit-tab ${state.exitTab==='salieron'?'active':''}" onclick="setExitTab('salieron')">Ya salieron</button>
    </div>` : "";

  if(state.records.length===0){
    cont.innerHTML = tabsHtml + `<div class="empty-state">
      <div class="es-ico">${ICON.doc}</div>
      <h3>Sin registros todavía</h3>
      <p>${canCreateInForm(form, state.user.rol)?`Creá la primera boleta de <b>${esc(form.title)}</b>. Se le asignará un consecutivo automático.`:`Todavía no hay boletas de <b>${esc(form.title)}</b>.`}</p>
      ${canCreateInForm(form, state.user.rol)?`<button class="btn solid" onclick="openEditor(FORM_BY_ID['${form.id}'],null)">${ICON.plus} Crear primera boleta</button>`:''}
    </div>`;
    return;
  }
  if(rows.length===0){
    const msg = q ? `No hay registros que coincidan con “${esc(q)}”.`
                  : (exitFlow && (state.exitTab||'activas')==='activas' ? 'No hay boletas activas: todas han salido.' :
                     exitFlow ? 'Todavía nadie ha salido.' : 'Sin registros.');
    cont.innerHTML = tabsHtml + `<div class="empty-state"><div class="es-ico">${ICON.search}</div><h3>Sin resultados</h3><p>${msg}</p></div>`;
    return;
  }

  const summaryKeys = pickSummaryFields(form);
  const showCreator = showsCreator(form);
  const canDelete = state.user.rol==="admin";
  const showExitBtn = exitFlow && canMarkExit(state.user.rol) && (state.exitTab||'activas')==='activas';
  // El rol seguridad no edita boletas de formularios que solo consulta
  // (aquellos donde no está autorizado a crear, como el permiso de salida).
  const canEditRec = canCreateInForm(form, state.user.rol);

  cont.innerHTML = tabsHtml + `<div class="table-wrap"><table class="tbl">
    <thead><tr>
      <th>Consecutivo</th>
      ${summaryKeys.map(k=>`<th class="${k.hideSm?'hide-sm':''}">${esc(k.label)}</th>`).join("")}
      ${showCreator?'<th>Creado por</th>':''}
      <th>Estado</th>
      <th style="text-align:right">Acciones</th>
    </tr></thead>
    <tbody>
      ${rows.map(r=>{
        const d=r.data||{};
        const complete = recordIsComplete(form, d);
        const salio = !!d._salida;
        const estadoHtml = exitFlow
          ? (salio
              ? `<span class="badge-st out" title="Salida confirmada por ${esc(creatorName(d._salidaPor))} · ${esc(fmtSalida(d._salidaEn))}">Ya salió</span>`
              : `<span class="badge-st active">Activa</span>`)
          : `<span class="badge-st ${complete?'complete':'partial'}">${complete?'Completa':'Pendiente'}</span>`;
        return `<tr>
          <td><span class="consec">${esc(r.consecutivo)}</span></td>
          ${summaryKeys.map(k=>`<td class="${k.hideSm?'hide-sm':''}">${esc(summaryValue(d, k))}</td>`).join("")}
          ${showCreator?`<td><span class="creator-tag" title="Creado por ${esc(creatorName(r.creadoPor))}"><span class="ct-av">${esc(initials(creatorName(r.creadoPor)))}</span>${esc(creatorName(r.creadoPor))}</span></td>`:''}
          <td>${estadoHtml}</td>
          <td><div class="row-actions">
            ${showExitBtn?`<button class="btn solid xs exit-btn" title="Confirmar que el colaborador ya salió" onclick="markExit('${r.id}')">${ICON.check} Aceptar salida</button>`:''}
            <button class="icon-btn view" title="Ver documento" onclick="viewRecord('${r.id}')">${ICON.eye}</button>
            ${canEditRec?`<button class="icon-btn edit" title="Editar" onclick="editRecord('${r.id}')">${ICON.edit}</button>`:''}
            <button class="icon-btn pdf" title="Descargar PDF" onclick="printRecord('${r.id}')">${ICON.pdf}</button>
            ${canDelete?`<button class="icon-btn del" title="Eliminar" onclick="deleteRecord('${r.id}')">${ICON.trash}</button>`:''}
          </div></td>
        </tr>`;
      }).join("")}
    </tbody>
  </table></div>`;
}

/* Cambia entre Activas / Ya salieron */
window.setExitTab = function(tab){ state.exitTab = tab; paintRecords(); };

/* Formatea la marca de tiempo de salida a algo legible */
function fmtSalida(iso){
  if(!iso) return "—";
  try{
    const dt = new Date(iso);
    const f = dt.toLocaleDateString("es-CR");
    let h = dt.getHours(), m = String(dt.getMinutes()).padStart(2,"0");
    const ap = h>=12?"p.m.":"a.m."; h = h%12||12;
    return `${f} ${h}:${m} ${ap}`;
  }catch(e){ return iso; }
}

/* Marca una boleta como "ya salió": guarda quién y cuándo, y la mueve
   a la pestaña "Ya salieron". Disponible para seguridad/encargado/admin. */
window.markExit = function(id){
  const r = state.records.find(x=>x.id===id);
  if(!r || !canMarkExit(state.user.rol)) return;
  const modal=el("div","modal-bg show");
  modal.innerHTML=`<div class="modal narrow"><div class="modal-body"><div class="confirm-body">
    <div class="confirm-ico" style="background:var(--grad-emerald)">${ICON.check}</div>
    <h3>¿Confirmar salida?</h3>
    <p>Se registrará que <b>${esc((r.data&&r.data.colaborador)||r.consecutivo)}</b> ya salió de la planta. La boleta pasará a <b>Ya salieron</b>.</p></div></div>
    <div class="modal-foot"><button class="btn ghost" id="mxC">Cancelar</button><button class="btn solid" id="mxO">${ICON.check} Confirmar salida</button></div></div>`;
  document.body.appendChild(modal);
  const close=()=>modal.remove();
  $("#mxC").onclick=close; modal.addEventListener("mousedown",e=>{if(e.target===modal)close();});
  $("#mxO").onclick=async()=>{
    const b=$("#mxO"); b.disabled=true; b.innerHTML='<span class="spinner sm" style="border-top-color:#fff;border-color:rgba(255,255,255,.4)"></span> Guardando…';
    try{
      const data = {...(r.data||{}), _salida:true, _salidaPor: state.user.usuario, _salidaEn: new Date().toISOString()};
      await dbUpdateRecord(id, { data });
      if(state.demo){ r.data = data; }
      close(); toast("Salida confirmada","ok");
      if(state.demo) paintRecords();
    }catch(e){ console.error(e); b.disabled=false; b.innerHTML=`${ICON.check} Confirmar salida`; toast("Error al confirmar","err"); }
  };
};

/* Resuelve el nombre legible de quien creó un registro (a partir del
   username guardado en creadoPor). Usa un mapa cargado de usuarios. */
function creatorName(usuario){
  if(!usuario) return "—";
  return (state.userMap && state.userMap[usuario]) || usuario;
}

function pickSummaryFields(form){
  // Si el formulario define summary (arreglo de keys), se usan esas columnas
  // en ese orden. Útil para priorizar campos clave (p. ej. el colaborador).
  if(Array.isArray(form.summary) && form.summary.length){
    const out=[];
    form.summary.forEach((key,i)=>{
      const f = form.fields.find(x=>x.k===key);
      if(f) out.push({k:f.k, label:f.label.length>22?f.label.slice(0,20)+"…":f.label, type:f.type, hideSm:i>=2});
    });
    if(out.length) return out;
  }
  // Por defecto: fecha + 2 primeros campos texto relevantes
  const out=[];
  const real = form.fields.filter(f=>!f.sec && f.type!=="signature" && f.type!=="checklist" && f.type!=="repeater");
  const dateF = real.find(f=>f.type==="date");
  if(dateF) out.push({k:dateF.k, label:"Fecha", type:"date"});
  for(const f of real){
    if(out.length>=3) break;
    if(f.type==="date") continue;
    if(["text","select","number"].includes(f.type)){
      out.push({k:f.k, label:f.label.length>22?f.label.slice(0,20)+"…":f.label, type:f.type, hideSm:out.length>=2});
    }
  }
  return out;
}
function summaryValue(d, k){
  let v = d[k.k];
  if(v==null||v==="") return "—";
  if(k.type==="date") return fmtDate(v);
  return String(v).length>30?String(v).slice(0,28)+"…":v;
}

/* acciones globales (llamadas desde HTML inline) */
window.editRecord = id => { const r=state.records.find(x=>x.id===id); if(!canCreateInForm(state.currentForm, state.user.rol)){ toast("No tenés permiso para editar esta boleta","warn"); return; } openEditor(state.currentForm, r); };
window.printRecord = id => { const r=state.records.find(x=>x.id===id); generatePDF(state.currentForm, r, "save"); };
window.viewRecord = id => { const r=state.records.find(x=>x.id===id); generatePDF(state.currentForm, r, "view"); };
window.deleteRecord = id => { const r=state.records.find(x=>x.id===id); confirmDelete(r); };
window.openEditor = (form,r)=>openEditor(form,r);
</script>

<script>
/* ======================================================================
   EDITOR DE FORMULARIO (modal)
   - record=null => nueva boleta (se reserva consecutivo al guardar)
   - rol "seguridad": solo puede llenar campos vacíos; los ya completados
     quedan bloqueados (no puede borrar lo existente).
   ====================================================================== */
let signaturePads = {}; // k -> {canvas, ctx, dirty}

async function openEditor(form, record){
  const isNew = !record;
  const data = record ? JSON.parse(JSON.stringify(record.data||{})) : {};
  const role = state.user.rol;
  // valores por defecto en nuevos
  if(isNew){
    form.fields.forEach(f=>{
      if(f.def==="today") data[f.k]=todayISO();
      if(f.def==="now")   data[f.k]=nowHM();
    });
  }
  // "locked originals": en edición y rol seguridad, los campos que YA tenían
  // valor no se pueden modificar. Guardamos snapshot.
  const originals = record ? JSON.parse(JSON.stringify(record.data||{})) : {};
  const lockField = (f)=>{
    if(hasFullAccess(role)) return false;
    if(isNew) return false;
    const ov = originals[f.k];
    return !(ov==null || ov==="" || (Array.isArray(ov)&&ov.length===0));
  };

  signaturePads = {};
  const consecLabel = isNew ? "Se asignará al guardar" : record.consecutivo;

  const body = buildFormBody(form, data, lockField);

  const modal = el("div","modal-bg show");
  modal.id="editorModal";
  modal.innerHTML = `
    <div class="modal wide">
      <div class="modal-head">
        <div class="mh-ico" style="background:${ACCENTS[form.accent]}">${ICON[form.icon]||ICON.doc}</div>
        <div>
          <h3>${isNew?'Nueva boleta':'Editar boleta'} · ${esc(form.title)}</h3>
          <div class="mh-sub">${form.code} · ${esc(form.empresa)}</div>
        </div>
        <button class="close" id="closeEditor">${ICON.close}</button>
      </div>
      <div class="modal-body">
        <div class="consec-banner">
          <div class="cb-ico">${ICON.hash}</div>
          <div><div class="cb-t">Consecutivo</div><div class="cb-v">${esc(consecLabel)}</div></div>
        </div>
        ${role==='seguridad' && !isNew ? `<div style="background:rgba(29,111,184,.08);border:1px solid rgba(29,111,184,.2);border-radius:11px;padding:10px 14px;margin-bottom:18px;font-size:12.5px;color:var(--ice-d)">${ICON.lockmini} Como usuario de seguridad solo podés completar los campos que aún están vacíos. Los campos ya registrados aparecen bloqueados.</div>`:''}
        <div class="form-grid" id="formGrid">${body}</div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" id="cancelEditor">Cancelar</button>
        <button class="btn solid" id="saveEditor"><span id="saveLbl">${isNew?'Crear boleta':'Guardar cambios'}</span></button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  document.body.style.overflow="hidden";

  // init signature pads + toggles + repeaters
  initFieldBehaviors(form, data, originals, lockField);

  const close = ()=>{ modal.remove(); document.body.style.overflow=""; };
  $("#closeEditor").onclick = close;
  $("#cancelEditor").onclick = close;
  modal.addEventListener("mousedown", e=>{ if(e.target===modal) close(); });

  $("#saveEditor").onclick = ()=>saveRecord(form, record, isNew, data, lockField, close);
}

/* ---- arma el cuerpo del formulario, agrupando en secciones contraíbles cuando el formulario lo permite ---- */
function buildFormBody(form, data, lockField){
  let out = "";
  let sec = null; // sección abierta actualmente
  const flushSec = ()=>{ if(sec){ out += `</div></div>`; sec=null; } };
  form.fields.forEach(f=>{
    if(f.sec){
      flushSec();
      const arrowIco = ICON.arrow.replace(/width="15" height="15"/,'width="13" height="13"').replace('<svg ','<svg class="coll-arrow" ');
      out += `<div class="coll-section collapsed"><div class="section-title" data-collsec>${arrowIco} ${esc(f.sec)}</div><div class="coll-body">`;
      sec = true;
    } else {
      out += renderField(f, data, lockField(f));
    }
  });
  flushSec();
  return out;
}

/* ---- render de un campo según tipo ---- */
function renderField(f, data, locked){
  if(f.sec) return `<div class="section-title">${ICON.arrow.replace(/width="15" height="15"/,'width="13" height="13"')} ${esc(f.sec)}</div>`;
  const cls = f.full ? "fg-full" : (f.half?"":"fg-full");
  const lockBadge = locked ? `<span class="locked">${ICON.lockmini} registrado</span>` : "";
  const req = f.req ? '<span class="req">*</span>' : '';
  const dis = locked ? "disabled" : "";
  const val = data[f.k];

  if(f.type==="signature"){
    return `<div class="ff sig-field" data-field="${f.k}">
      <label>${esc(f.label)} ${req} ${lockBadge}</label>
      ${locked && val ? `<img class="sig-locked-img" src="${val}" alt="firma">` :
      `<div class="sig-box ${val?'signed':''}" data-sig="${f.k}">
        <canvas></canvas>
        <div class="sig-placeholder">${ICON.pen}<span>Firmá aquí con el dedo o el mouse</span></div>
      </div>
      <div class="sig-actions">
        <span class="sig-status ${val?'ok':''}" id="sigst_${f.k}">${val?ICON.check+' Firmado':'Sin firmar'}</span>
        <button type="button" class="sig-clear" data-clear="${f.k}">${ICON.trash.replace(/width="17" height="17"/,'width="13" height="13"')} Limpiar</button>
      </div>`}
    </div>`;
  }
  if(f.type==="toggle"){
    const yes = val==="Sí", no = val==="No";
    return `<div class="ff fg-full" data-field="${f.k}">
      <label>${esc(f.label)} ${req} ${lockBadge}</label>
      <div class="toggle-row" data-toggle="${f.k}">
        <button type="button" class="toggle-opt ${yes?'on-yes':''}" data-val="Sí" ${dis}>Sí</button>
        <button type="button" class="toggle-opt ${no?'on-no':''}" data-val="No" ${dis}>No</button>
      </div>
    </div>`;
  }
  if(f.type==="checklist"){
    return `<div class="ff fg-full"><label>${esc(f.sec||'Aspectos a evaluar')}</label>
      <div class="check-grid" data-check="${f.k}">
        ${f.items.map(it=>{
          const cv = (val&&val[it.n])||"";
          return `<div class="check-item">
            <span class="ci-num">${it.n}</span>
            <div class="ci-label">${esc(it.label)}${it.hint?`<div style="font-size:11px;color:var(--muted-2);font-weight:400;margin-top:2px">${esc(it.hint)}</div>`:''}</div>
            <div class="toggle-row" style="width:130px;flex-shrink:0" data-chk="${it.n}">
              <button type="button" class="toggle-opt ${cv==='Sí'?'on-yes':''}" data-val="Sí" ${dis} style="padding:7px">Sí</button>
              <button type="button" class="toggle-opt ${cv==='No'?'on-no':''}" data-val="No" ${dis} style="padding:7px">No</button>
            </div>
          </div>`;
        }).join("")}
      </div></div>`;
  }
  if(f.type==="repeater"){
    return `<div class="subtable" data-rep="${f.k}">
      <div class="subtable-head"><h4>${esc(f.title||f.label)}</h4></div>
      <div class="sub-rows" id="reprows_${f.k}"></div>
      ${locked?'':`<button type="button" class="add-row" data-addrep="${f.k}">${ICON.plus} ${esc(f.addLabel||'Agregar fila')}</button>`}
    </div>`;
  }
  // input genérico
  let input="";
  if(f.type==="textarea"){
    input = `<textarea data-k="${f.k}" ${dis} placeholder="${esc(f.label)}">${esc(val||"")}</textarea>`;
  } else if(f.type==="select"){
    const hasOtro = f.options.some(o=>/^otr[oa]$/i.test(o));
    const otroVal = data[f.k+"_otro"]||"";
    const showOtro = hasOtro && /^otr[oa]$/i.test(val||"");
    input = `<select data-k="${f.k}" data-hasotro="${hasOtro?1:0}" ${dis}><option value="">— Seleccionar —</option>${f.options.map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join("")}</select>`;
    if(hasOtro){
      input += `<input type="text" class="otro-input" data-kotro="${f.k}" value="${esc(otroVal)}" ${dis} placeholder="Especifique…" style="margin-top:8px;display:${showOtro?'block':'none'}">`;
    }
  } else {
    const t = f.type==="number"?"number":(f.type==="date"?"date":(f.type==="time"?"time":"text"));
    input = `<input type="${t}" data-k="${f.k}" value="${esc(val||"")}" ${dis} placeholder="${esc(f.label)}">`;
  }
  // campo condicional: solo visible si el campo referenciado tiene fecha vencida
  let condStyle = "", condAttr = "";
  if(f.showIfExpired){
    condAttr = ` data-showifexpired="${f.showIfExpired}"`;
    const refVal = data[f.showIfExpired];
    const visible = isExpired(refVal) ;
    if(!visible) condStyle = ' style="display:none"';
  }
  return `<div class="ff ${cls}"${condStyle} data-field="${f.k}"${condAttr}>
    <label>${esc(f.label)} ${req} ${lockBadge}</label>
    ${input}
    ${f.hint?`<span class="hint" style="color:var(--warn)">${esc(f.hint)}</span>`:''}
  </div>`;
}
function isExpired(iso){
  if(!iso) return false;
  const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return false;
  const today=new Date(); today.setHours(0,0,0,0);
  return d < today;
}

/* ---- comportamientos: firmas, toggles, repeaters ---- */
function initFieldBehaviors(form, data, originals, lockField){
  // SECCIONES CONTRAÍBLES/EXPANDIBLES (clic en el título con la flecha)
  $$("[data-collsec]").forEach(head=>{
    head.onclick = ()=>{ head.closest(".coll-section").classList.toggle("collapsed"); };
  });

  // SIGNATURE PADS
  $$(".sig-box").forEach(box=>{
    const k = box.dataset.sig;
    const canvas = box.querySelector("canvas");
    setupSignaturePad(canvas, box, k, data);
    // si ya hay firma previa, dibujarla
    if(data[k]){ drawDataURLToCanvas(canvas, data[k]); box.classList.add("signed"); }
  });
  $$("[data-clear]").forEach(btn=>{
    btn.onclick = ()=>{
      const k=btn.dataset.clear;
      const pad = signaturePads[k];
      if(pad){ pad.ctx.clearRect(0,0,pad.canvas.width,pad.canvas.height); pad.dirty=false; }
      data[k]=null;
      const box=document.querySelector(`[data-sig="${k}"]`); box.classList.remove("signed");
      const st=$("#sigst_"+k); if(st){ st.classList.remove("ok"); st.textContent="Sin firmar"; }
    };
  });

  // TOGGLES
  $$("[data-toggle]").forEach(tr=>{
    const k=tr.dataset.toggle;
    tr.querySelectorAll(".toggle-opt").forEach(opt=>{
      opt.onclick = ()=>{
        if(opt.disabled) return;
        const v=opt.dataset.val;
        data[k] = (data[k]===v)? null : v;
        tr.querySelectorAll(".toggle-opt").forEach(o=>{ o.classList.remove("on-yes","on-no"); });
        if(data[k]==="Sí") opt.classList.add("on-yes");
        else if(data[k]==="No") opt.classList.add("on-no");
      };
    });
  });

  // CHECKLIST
  $$("[data-check]").forEach(cg=>{
    const k=cg.dataset.check;
    if(!data[k]) data[k]={};
    cg.querySelectorAll("[data-chk]").forEach(row=>{
      const n=row.dataset.chk;
      row.querySelectorAll(".toggle-opt").forEach(opt=>{
        opt.onclick=()=>{
          if(opt.disabled) return;
          const v=opt.dataset.val;
          data[k][n] = (data[k][n]===v)?"":v;
          row.querySelectorAll(".toggle-opt").forEach(o=>o.classList.remove("on-yes","on-no"));
          if(data[k][n]==="Sí") opt.classList.add("on-yes");
          else if(data[k][n]==="No") opt.classList.add("on-no");
        };
      });
    });
  });

  // REPEATERS
  form.fields.filter(f=>f.type==="repeater").forEach(f=>{
    const k=f.k;
    if(!Array.isArray(data[k])) data[k]=[];
    const cont = $("#reprows_"+k);
    const locked = lockField(f);
    const renderRows = ()=>{
      cont.innerHTML="";
      data[k].forEach((row,idx)=>{
        const rEl=el("div","sub-row");
        rEl.style.gridTemplateColumns = f.cols.length>6 ? `repeat(auto-fit, minmax(150px,1fr))` : `repeat(${f.cols.length}, 1fr) auto`;
        rEl.innerHTML = f.cols.map(c=>{
          const cv=row[c.k]||"";
          if(c.type==="select"){
            return `<div class="ff"><label${c.hint?` title="${esc(c.hint)}"`:''}>${esc(c.label)}</label><select data-rk="${c.k}" data-idx="${idx}" ${locked?'disabled':''}><option value="">—</option>${c.options.map(o=>`<option ${cv===o?'selected':''}>${esc(o)}</option>`).join("")}</select></div>`;
          }
          return `<div class="ff"><label${c.hint?` title="${esc(c.hint)}"`:''}>${esc(c.label)}</label><input data-rk="${c.k}" data-idx="${idx}" value="${esc(cv)}" ${locked?'disabled':''}></div>`;
        }).join("") + (locked?'':`<button type="button" class="rm-row" data-rm="${idx}">${ICON.trash.replace(/width="17" height="17"/,'width="15" height="15"')}</button>`);
        cont.appendChild(rEl);
      });
      cont.querySelectorAll("[data-rk]").forEach(inp=>{
        inp.oninput = ()=>{ data[k][+inp.dataset.idx][inp.dataset.rk]=inp.value; };
        inp.onchange = ()=>{ data[k][+inp.dataset.idx][inp.dataset.rk]=inp.value; };
      });
      cont.querySelectorAll("[data-rm]").forEach(b=>{
        b.onclick=()=>{ data[k].splice(+b.dataset.rm,1); renderRows(); };
      });
    };
    renderRows();
    const addBtn=document.querySelector(`[data-addrep="${k}"]`);
    if(addBtn) addBtn.onclick=()=>{ data[k].push({}); renderRows(); };
  });

  // INPUTS genéricos -> data
  $$("#formGrid [data-k]").forEach(inp=>{
    const k=inp.dataset.k;
    const sync=()=>{
      data[k]=inp.value;
      // manejo de opción "Otro" en selects
      if(inp.dataset.hasotro==="1"){
        const otro = document.querySelector(`[data-kotro="${k}"]`);
        if(otro){
          const show = /^otr[oa]$/i.test(inp.value);
          otro.style.display = show?"block":"none";
          if(!show){ otro.value=""; data[k+"_otro"]=""; }
          else { setTimeout(()=>otro.focus(),50); }
        }
      }
      // campos condicionales por fecha vencida que dependen de este campo
      document.querySelectorAll(`[data-showifexpired="${k}"]`).forEach(cond=>{
        const show = isExpired(inp.value);
        cond.style.display = show?"":"none";
        if(!show){ const ci=cond.querySelector("[data-k]"); if(ci){ ci.value=""; data[ci.dataset.k]=""; } }
      });
    };
    inp.oninput=sync; inp.onchange=sync;
  });
  // inputs "Otro" -> data
  $$('#formGrid [data-kotro]').forEach(inp=>{
    const k=inp.dataset.kotro;
    const sync=()=>{ data[k+"_otro"]=inp.value; };
    inp.oninput=sync; inp.onchange=sync;
  });
}
</script>

<script>
/* ======================================================================
   SIGNATURE PAD
   ====================================================================== */
function setupSignaturePad(canvas, box, key, data){
  const ratio = window.devicePixelRatio||1;
  const resize = ()=>{
    const rect = canvas.getBoundingClientRect();
    const w = rect.width||box.clientWidth||400;
    const h = 150;
    canvas.width = w*ratio; canvas.height = h*ratio;
    const ctx = canvas.getContext("2d");
    ctx.scale(ratio,ratio);
    ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#10231b";
    signaturePads[key] = {canvas, ctx, dirty:!!data[key], w, h};
    if(data[key]) drawDataURLToCanvas(canvas, data[key]);
  };
  setTimeout(resize, 30);

  let drawing=false, last=null;
  const pos = e=>{
    const r=canvas.getBoundingClientRect();
    const t = e.touches?e.touches[0]:e;
    return {x:t.clientX-r.left, y:t.clientY-r.top};
  };
  const start = e=>{
    e.preventDefault();
    const pad=signaturePads[key]; if(!pad) return;
    drawing=true; last=pos(e);
    pad.ctx.beginPath(); pad.ctx.moveTo(last.x,last.y);
  };
  const move = e=>{
    if(!drawing) return;
    e.preventDefault();
    const pad=signaturePads[key]; const p=pos(e);
    pad.ctx.lineTo(p.x,p.y); pad.ctx.stroke();
    last=p;
    if(!pad.dirty){ pad.dirty=true; markSigned(key,box,data,canvas); }
  };
  const end = ()=>{ if(drawing){ drawing=false; saveSig(key,data,canvas); } };

  canvas.addEventListener("mousedown",start);
  canvas.addEventListener("mousemove",move);
  window.addEventListener("mouseup",end);
  canvas.addEventListener("touchstart",start,{passive:false});
  canvas.addEventListener("touchmove",move,{passive:false});
  canvas.addEventListener("touchend",end);
}
function markSigned(key,box,data,canvas){
  box.classList.add("signed");
  const st=$("#sigst_"+key); if(st){ st.classList.add("ok"); st.innerHTML=ICON.check+' Firmado'; }
}
function saveSig(key,data,canvas){
  data[key]=canvas.toDataURL("image/png");
}
function drawDataURLToCanvas(canvas, url){
  const img=new Image();
  img.onload=()=>{
    const ctx=canvas.getContext("2d");
    const ratio=window.devicePixelRatio||1;
    ctx.drawImage(img,0,0,canvas.width/ratio,canvas.height/ratio);
  };
  img.src=url;
}

/* ======================================================================
   GUARDAR REGISTRO
   ====================================================================== */
async function saveRecord(form, record, isNew, data, lockField, close){
  // validar requeridos
  const miss = missingFields(form, data);
  // firmas requeridas
  const missSig = form.fields.filter(f=>f.type==="signature" && f.req && !data[f.k]);
  if(miss.length || missSig.length){
    const names = [...miss, ...missSig].map(f=>f.label).slice(0,4).join(", ");
    toast("Faltan campos obligatorios: "+names+(miss.length+missSig.length>4?"…":""), "warn", 4200);
    // resaltar primer faltante
    const first=[...miss,...missSig][0];
    const node=document.querySelector(`[data-field="${first.k}"]`);
    if(node){ node.scrollIntoView({behavior:"smooth",block:"center"}); node.style.animation="shake .4s"; setTimeout(()=>node.style.animation="",500); }
    return;
  }

  const btn=$("#saveEditor"), lbl=$("#saveLbl");
  btn.disabled=true; lbl.innerHTML='<span class="spinner sm" style="border-top-color:#fff;border-color:rgba(255,255,255,.4)"></span> Guardando…';

  try{
    const complete = recordIsComplete(form, data);
    if(isNew){
      const consec = await nextConsecutivo(form.code);
      const rec = {
        formId: form.id, formCode: form.code, consecutivo: consec,
        data, complete,
        creadoPor: state.user.usuario, creadoEn: new Date().toISOString(),
        editadoPor: state.user.usuario, editadoEn: new Date().toISOString()
      };
      const saved = await dbCreateRecord(rec);
      if(state.demo) state.records.unshift(saved); // en tiempo real lo trae el snapshot
      toast("Boleta creada · "+consec, "ok");
    } else {
      const patch = { data, complete, editadoPor:state.user.usuario, editadoEn:new Date().toISOString() };
      await dbUpdateRecord(record.id, patch);
      Object.assign(record, patch);
      toast("Cambios guardados", "ok");
    }
    close();
    if(state.demo) paintRecords(); // en tiempo real repinta el listener
  }catch(e){
    console.error(e);
    btn.disabled=false; lbl.textContent=isNew?'Crear boleta':'Guardar cambios';
    toast("Error al guardar: "+(e.message||e), "err", 4500);
  }
}

/* ======================================================================
   CONFIRMACIÓN DE BORRADO (solo admin)
   ====================================================================== */
function confirmDelete(record){
  if(state.user.rol!=="admin"){ toast("Solo el administrador puede eliminar registros","warn"); return; }
  const modal=el("div","modal-bg show");
  modal.innerHTML=`
    <div class="modal narrow">
      <div class="modal-body">
        <div class="confirm-body">
          <div class="confirm-ico">${ICON.trash}</div>
          <h3>¿Eliminar esta boleta?</h3>
          <p>Vas a eliminar de forma permanente el registro <b>${esc(record.consecutivo)}</b>. Esta acción no se puede deshacer.</p>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" id="cdCancel">Cancelar</button>
        <button class="btn danger" id="cdOk">${ICON.trash.replace(/width="17" height="17"/,'width="16" height="16"')} Eliminar</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  const close=()=>modal.remove();
  $("#cdCancel").onclick=close;
  modal.addEventListener("mousedown",e=>{ if(e.target===modal) close(); });
  $("#cdOk").onclick=async()=>{
    const b=$("#cdOk"); b.disabled=true; b.innerHTML='<span class="spinner sm" style="border-top-color:#fff;border-color:rgba(255,255,255,.4)"></span> Eliminando…';
    try{
      await dbDeleteRecord(record.id);
      if(state.demo){ state.records=state.records.filter(x=>x.id!==record.id); paintRecords(); }
      close();
      toast("Registro eliminado","ok");
    }catch(e){ console.error(e); b.disabled=false; b.textContent="Eliminar"; toast("Error al eliminar","err"); }
  };
}
</script>

<script>
/* ======================================================================
   GENERACIÓN DE PDF (boleta imprimible)
   Usa jsPDF + autoTable. Incluye logo, encabezado tipo SIG, consecutivo,
   campos por sección, sub-tablas, checklists y firmas embebidas.
   ====================================================================== */
async function generatePDF(form, record, mode="save"){
  toast(mode==="view"?"Abriendo documento…":"Generando PDF…","info",1500);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const PW = doc.internal.pageSize.getWidth();
  const PH = doc.internal.pageSize.getHeight();
  const M = 14;
  const data = record.data||{};
  const accentRGB = accentToRGB(form.accent);

  /* ---------- ENCABEZADO ---------- */
  // ambos logos (B&C + Bajo Cero) apilados en la celda izquierda
  try{
    const dB = await imgSize(LOGOS.byc);
    const dC = await imgSize(LOGOS.bc);
    const lh = 8;
    const wB = Math.min(lh*(dB.w/dB.h), 40);
    const wC = Math.min(lh*(dC.w/dC.h), 40);
    doc.addImage(LOGOS.byc, "PNG", M+1, 11, wB, lh);
    doc.addImage(LOGOS.bc,  "PNG", M+1, 20.5, wC, lh);
  }catch(e){}

  // marco cabecera
  doc.setDrawColor(200); doc.setLineWidth(0.3);
  const headY=10, headH=23;
  doc.rect(M, headY, PW-2*M, headH);
  // divisiones
  const c1=M+46, c2=PW-M-44;
  doc.line(c1, headY, c1, headY+headH);
  doc.line(c2, headY, c2, headY+headH);
  // título central (tamaño dinámico según largo, subtítulos siempre debajo)
  const midX=(c1+c2)/2, innerW=c2-c1-4;
  let tSize = form.title.length>42?9:(form.title.length>30?10.5:12);
  doc.setFont("helvetica","bold"); doc.setFontSize(tSize); doc.setTextColor(20);
  let tLines = doc.splitTextToSize(form.title, innerW);
  // limitar a 2 líneas; si excede, reducir más
  if(tLines.length>2){ tSize=8; doc.setFontSize(tSize); tLines=doc.splitTextToSize(form.title, innerW); }
  const lineH = tSize*0.42;
  const titleBlockH = tLines.length*lineH;
  // bloque título+empresa+sistema centrado verticalmente en la celda
  let ty = headY + (headH - (titleBlockH + 7))/2 + lineH;
  doc.text(tLines, midX, ty, {align:"center"});
  let sy = ty + (tLines.length-1)*lineH + 3.4;
  doc.setFont("helvetica","normal"); doc.setFontSize(7); doc.setTextColor(90);
  doc.text(form.empresa, midX, sy, {align:"center", maxWidth:innerW});
  doc.setFontSize(6.5);
  doc.text(form.sistema, midX, sy+3.3, {align:"center", maxWidth:innerW});
  // bloque código
  doc.setFontSize(7); doc.setTextColor(40);
  const cx=c2+3;
  doc.text(`Código: ${form.code}`, cx, headY+5);
  doc.text(`Versión: 001`, cx, headY+10);
  doc.text(`Página 1/1`, cx, headY+15);

  /* ---------- BANNER CONSECUTIVO ---------- */
  let y = headY+headH+6;
  doc.setFillColor(accentRGB[0],accentRGB[1],accentRGB[2]);
  doc.roundedRect(M, y, PW-2*M, 11, 2,2,"F");
  doc.setTextColor(255); doc.setFont("helvetica","bold"); doc.setFontSize(8);
  doc.text("CONSECUTIVO", M+4, y+4.5);
  doc.setFontSize(13);
  doc.text(record.consecutivo, M+4, y+9);
  doc.setFont("helvetica","normal"); doc.setFontSize(7.5);
  const estado = recordIsComplete(form,data)?"COMPLETA":"PENDIENTE";
  doc.text(`Estado: ${estado}`, PW-M-4, y+5.5, {align:"right"});
  doc.text(`Generado: ${new Date().toLocaleString("es-CR")}`, PW-M-4, y+9, {align:"right"});
  y+=16;

  /* ---------- CAMPOS POR SECCIÓN ---------- */
  const signatures=[]; // {label, img}
  doc.setTextColor(30);

  for(const f of form.fields){
    if(f.sec){
      ensureSpace(doc, y, 12, ()=>y=20);
      if(y>20) y+=2;
      doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(accentRGB[0],accentRGB[1],accentRGB[2]);
      doc.text(f.sec.toUpperCase(), M, y);
      doc.setDrawColor(accentRGB[0],accentRGB[1],accentRGB[2]); doc.setLineWidth(0.4);
      doc.line(M, y+1.5, PW-M, y+1.5);
      y+=6; doc.setTextColor(30);
      continue;
    }
    if(f.type==="signature"){
      if(data[f.k]){
        let nm = "";
        if(f.nameField){
          const nf = form.fields.find(x=>x.k===f.nameField);
          let raw = data[f.nameField];
          if(nf && /^otr[oa]$/i.test(raw||"") && data[f.nameField+"_otro"]) raw = data[f.nameField+"_otro"];
          nm = raw||"";
        }
        signatures.push({label:f.label, img:data[f.k], name:nm});
      }
      continue;
    }
    if(f.type==="checklist"){
      const rows = f.items.map(it=>[String(it.n), it.label, (data[f.k]&&data[f.k][it.n])||"—"]);
      doc.autoTable({
        startY:y, margin:{left:M,right:M},
        head:[["N°","Aspecto a evaluar","¿Presenta?"]],
        body:rows,
        theme:"grid", styles:{fontSize:8, cellPadding:1.6, textColor:[40,40,40]},
        headStyles:{fillColor:accentRGB, textColor:255, fontSize:8},
        columnStyles:{0:{cellWidth:10,halign:"center"},2:{cellWidth:24,halign:"center"}}
      });
      y = doc.lastAutoTable.finalY+5;
      continue;
    }
    if(f.type==="repeater"){
      const arr = data[f.k]||[];
      if(arr.length){
        const head=[f.cols.map(c=>c.label)];
        const rows=arr.map(r=>f.cols.map(c=>r[c.k]||"—"));
        doc.autoTable({
          startY:y, margin:{left:M,right:M},
          head, body:rows, theme:"grid",
          styles:{fontSize:7.5, cellPadding:1.4, textColor:[40,40,40]},
          headStyles:{fillColor:accentRGB, textColor:255, fontSize:7.5}
        });
        y = doc.lastAutoTable.finalY+5;
      }
      continue;
    }
    // campo normal -> label: value
    let v = data[f.k];
    if(f.type==="date") v=fmtDate(v);
    else if(f.type==="time") v=fmt12h(v);
    else if(/^otr[oa]$/i.test(v||"") && data[f.k+"_otro"]) v="Otro: "+data[f.k+"_otro"];
    if(v==null||v==="") v="—";
    ensureSpace(doc, y, 9, ()=>y=20);
    doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(70);
    doc.text(f.label+":", M, y);
    const lblW = doc.getTextWidth(f.label+":");
    doc.setFont("helvetica","normal"); doc.setTextColor(20); doc.setFontSize(8.5);
    const lines = doc.splitTextToSize(String(v), PW-2*M-lblW-3);
    doc.text(lines, M+lblW+2, y);
    y += Math.max(5.5, lines.length*4.4);
  }

  /* ---------- FIRMAS ---------- */
  if(signatures.length){
    ensureSpace(doc, y, 36, ()=>y=20);
    y+=3;
    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(accentRGB[0],accentRGB[1],accentRGB[2]);
    doc.text("FIRMAS", M, y);
    doc.line(M, y+1.5, PW-M, y+1.5); y+=6;
    const perRow=2, cellW=(PW-2*M-6)/perRow, sigH=30;
    let i=0;
    while(i<signatures.length){
      ensureSpace(doc, y, sigH+8, ()=>y=20);
      for(let c=0;c<perRow && i<signatures.length;c++,i++){
        const sx = M + c*(cellW+6);
        const s = signatures[i];
        doc.setDrawColor(200); doc.setLineWidth(0.3);
        doc.rect(sx, y, cellW, sigH);
        // firma (imagen)
        try{ doc.addImage(s.img,"PNG", sx+2, y+1.5, cellW-4, 15); }catch(e){}
        // línea de firma
        doc.setDrawColor(150); doc.setLineWidth(0.3);
        doc.line(sx+6, y+18, sx+cellW-6, y+18);
        // nombre debajo de la firma
        if(s.name){
          doc.setFont("helvetica","bold"); doc.setFontSize(7.5); doc.setTextColor(30);
          doc.text(doc.splitTextToSize(s.name, cellW-4), sx+cellW/2, y+22, {align:"center"});
        }
        // etiqueta (rol)
        doc.setFont("helvetica","normal"); doc.setFontSize(6.5); doc.setTextColor(110);
        doc.text(s.label, sx+cellW/2, y+sigH-2.5, {align:"center", maxWidth:cellW-3});
      }
      y+=sigH+5;
    }
  }

  /* ---------- FIRMAS ESTÁTICAS DEL PIE (elaborado/revisado/aprobado) ---------- */
  if(form.footerSign){
    ensureSpace(doc, y, 20, ()=>y=20);
    y+=2;
    const n=form.footerSign.length, cw=(PW-2*M)/n;
    form.footerSign.forEach((fs,idx)=>{
      const sx=M+idx*cw;
      doc.setDrawColor(120); doc.setLineWidth(0.3);
      doc.line(sx+4, y+10, sx+cw-4, y+10);
      doc.setFont("helvetica","bold"); doc.setFontSize(7); doc.setTextColor(60);
      doc.text(fs.label, sx+cw/2, y+14, {align:"center"});
      if(fs.static){ doc.setFont("helvetica","normal"); doc.setFontSize(6.5); doc.setTextColor(90);
        doc.text(doc.splitTextToSize(fs.static, cw-6), sx+cw/2, y+17.5, {align:"center"}); }
    });
    y+=22;
  }

  /* ---------- PIE ---------- */
  doc.setFontSize(6.5); doc.setTextColor(150);
  doc.text(`SecuDocs · ${form.empresa} · Registrado por: ${record.creadoPor||"—"} · ${record.consecutivo}`, M, PH-8);

  if(mode==="view"){
    openPdfViewer(doc, record.consecutivo);
  } else {
    doc.save(`${record.consecutivo}.pdf`);
    toast("PDF generado: "+record.consecutivo,"ok");
  }
}

/* Visor de PDF inline (modal con iframe + botón descargar) */
function openPdfViewer(doc, consec){
  const url = doc.output("bloburl");
  const modal = el("div","modal-bg show");
  modal.innerHTML = `
    <div class="modal" style="max-width:860px;width:100%">
      <div class="modal-head">
        <div class="mh-ico" style="background:var(--grad-emerald)">${ICON.pdf}</div>

        <button class="btn solid" id="pvDl">${ICON.pdf} Descargar PDF</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  document.body.style.overflow="hidden";
  const close=()=>{ modal.remove(); document.body.style.overflow=""; URL.revokeObjectURL(url); };

  $("#pvDl").onclick=()=>doc.save(`${consec}.pdf`);
}

function ensureSpace(doc, y, need, reset){
  const PH=doc.internal.pageSize.getHeight();
  if(y+need > PH-14){ doc.addPage(); reset(); }
}
function imgSize(url){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res({w:i.width,h:i.height}); i.onerror=rej; i.src=url; }); }

}

function canManageBadges(){ return state.user.rol==="admin" || state.user.rol==="encargado"; }

/* Genera el dataURL (imagen GIF) de un código QR usando la librería embebida
   qrcode-generator. Es síncrona y no depende de la red ni del DOM, así que el
   carnet siempre se puede mostrar. Devuelve "" solo si algo falla de raíz. */
function makeQRDataURL(text, size){
  size = size || 220;
  try{
    const gen = (typeof qrcode!=="undefined") ? qrcode : (window && window.qrcode);
    if(!gen) return "";
    const qr = gen(0, "M");         // versión automática, corrección media
    qr.addData(String(text||""));
    qr.make();
    const count = qr.getModuleCount();
    // tamaño de celda para acercarnos al tamaño pedido en píxeles
    const cell = Math.max(2, Math.round(size / (count + 8)));
    return qr.createDataURL(cell, cell*2);   // (cellSize, margin)
  }catch(e){ console.error("QR error:", e); return ""; }
}

/* ---------- Vista de verificación de gafete (rol Seguridad) ----------
   Solo escanear/buscar por código y ver la ficha. Sin lista, sin crear ni
   editar. Si el gafete está vencido, se muestra igual con aviso en rojo. */
function renderVerifyBadge(){
  if(state.user.rol!=="seguridad" && state.user.rol!=="admin"){ state.view="dashboard"; renderDashboard(); return; }
  stopRealtime();
  const main=$("#main");
  main.innerHTML=`
    <div class="page-head">
      <h2>Verificar gafete</h2>
      <p>Escaneá el código QR del carnet con un lector, o escribí el código interno (ej. <b>BYCU-0001</b>) y presioná Enter. Se mostrará la ficha del colaborador y si el carnet está vigente.</p>
    </div>
    <div class="verify-tool">
      <div class="scan-row">
        <div class="scan-box big">
          <span class="ico">${ICON.scan}</span>
          <input id="vbInput" placeholder="Código del gafete…" autocomplete="off" autofocus>
          <button class="scan-cam-ico" id="vbCamBtn" title="Escanear con cámara" aria-label="Escanear con cámara">${ICON.camera}</button>
        </div>
      </div>
      <div id="vbCamWrap" class="vb-cam-wrap" style="display:none">
        <video id="vbVideo" playsinline muted></video>
        <div class="vb-cam-overlay"><div class="vb-cam-frame"></div></div>
        <button class="btn ghost vb-cam-close" id="vbCamClose">${ICON.close} Cerrar cámara</button>
        <p class="vb-cam-hint">Apuntá la cámara al código QR del carnet</p>
      </div>
      <div id="vbResult" class="vb-result"></div>
    </div>

    <div class="vb-hist-section">
      <div class="vb-hist-head">
        <h3>${ICON.doc} Historial de verificaciones</h3>
        ${state.user.rol==="seguridad"?"":`<button class="btn ghost sm" id="vbHistExport">${ICON.doc} Exportar a Excel</button>`}
      </div>
      <div class="search-box"><span class="ico">${ICON.search}</span><input id="vbHistSearch" placeholder="Buscar por código, nombre o cédula…" autocomplete="off"></div>
      <div id="vbHistList"><div class="loader-wrap sm"><div class="spinner"></div><p>Cargando historial…</p></div></div>
    </div>`;

  const input=$("#vbInput");
  input.focus();

  const doLookup=async()=>{
    const code=(input.value||"").trim().toUpperCase();
    if(!code) return;
    const box=$("#vbResult");
    box.innerHTML=`<div class="loader-wrap"><div class="spinner"></div><p>Buscando ${esc(code)}…</p></div>`;
    let b=null;
    try{ b=await dbGetBadgeByCode(code); }catch(e){ console.error(e); }
    if(!b){
      box.innerHTML=`<div class="vb-card"><div class="vb-empty">${ICON.warn}<div><b>Gafete no encontrado</b><span>El código <b>${esc(code)}</b> no corresponde a ningún carnet registrado.</span></div></div></div>`;
      input.select();
      return;
    }
    const vig=badgeVigente(b);
    const pendiente = (b.estado||"activo")==="pendiente";
    // Registrar en el historial de verificaciones (no bloquea la vista)
    const estado = pendiente ? "pendiente" : (vig===false ? "vencido" : (vig===true ? "vigente" : "sin_fecha"));
    dbLogVerification({
      codigo: b.codigo,
      nombre: b.nombre,
      cedula: b.cedula||"",
      puesto: b.puesto||"",
      compania: b.compania||"",
      estado,
      verificadoPor: state.user.usuario,
      verificadoNombre: state.user.nombre,
      fecha: new Date().toISOString()
    }).catch(e=>console.error("log verificación:",e)).then(()=>{ if(window.__reloadVerifyHist) window.__reloadVerifyHist(); });
    const qr=makeQRDataURL(badgeVerifyURL(b.codigo),200);
    const banner = pendiente
      ? `<div class="vb-banner vencido">${ICON.warn} CARNET PENDIENTE — aún no aprobado por Sistemas</div>`
      : (vig===false
        ? `<div class="vb-banner vencido">${ICON.warn} CARNET VENCIDO — venció el ${esc(fmtCarnetDate(b.fechaVence))}</div>`
        : (vig===true
            ? `<div class="vb-banner vigente">${ICON.check} CARNET VIGENTE — válido hasta ${esc(fmtCarnetDate(b.fechaVence))}</div>`
            : `<div class="vb-banner neutro">${ICON.info} Sin fecha de vencimiento registrada</div>`));
    box.innerHTML=`
      <div class="vb-card ${pendiente||vig===false?'is-vencido':(vig===true?'is-vigente':'')}">
        ${banner}
        <div class="vb-body">
          <div class="vb-photo">${b.foto?`<img src="${b.foto}">`:`<div class="vb-photo-empty">${ICON.user}</div>`}</div>
          <div class="vb-info">
            <b class="vb-name">${esc(b.nombre)}</b>
            <div class="vb-rows">
              <span>${ICON.hash} <b>${esc(b.codigo)}</b></span>
              <span>Cédula: ${esc(b.cedula)}</span>
              <span>${esc(b.puesto||"—")}</span>
              <span class="vb-comp">${esc(b.compania||"")}</span>
            </div>
            <div class="vb-dates">
              <span>Ingreso: <b>${esc(fmtCarnetDate(b.fechaIngreso))}</b></span>
              <span>Vence: <b>${esc(fmtCarnetDate(b.fechaVence))}</b></span>
            </div>
          </div>
          <div class="vb-qr">${qr?`<img src="${qr}">`:''}</div>
        </div>
      </div>`;
    input.select();
  };

  input.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); doLookup(); } });

  // ----- Escaneo con cámara (jsQR) -----
  let stream=null, rafId=null, scanning=false;
  const camWrap=$("#vbCamWrap"), video=$("#vbVideo");
  const canvas=document.createElement("canvas");
  const ctx=canvas.getContext("2d", {willReadFrequently:true});

  // Extrae el código interno del contenido del QR. El QR nuevo lleva una URL
  // (...?gafete=BYCU-0001); los viejos podían llevar el código pelado.
  function codeFromQR(text){
    if(!text) return "";
    text=String(text).trim();
    const m=text.match(/[?&]gafete=([^&]+)/i);
    if(m) return decodeURIComponent(m[1]).toUpperCase();
    return text.toUpperCase();
  }

  function stopCamera(){
    scanning=false;
    if(rafId) cancelAnimationFrame(rafId);
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    if(camWrap) camWrap.style.display="none";
  }
  // liberar cámara al salir de la vista
  state._stopVerifyCam = stopCamera;

  function tick(){
    if(!scanning) return;
    if(video.readyState===video.HAVE_ENOUGH_DATA){
      canvas.width=video.videoWidth; canvas.height=video.videoHeight;
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      let img;
      try{ img=ctx.getImageData(0,0,canvas.width,canvas.height); }catch(e){ img=null; }
      const jq=(typeof jsQR!=="undefined")?jsQR:(window&&window.jsQR);
      if(img && jq){
        const res=jq(img.data,img.width,img.height,{inversionAttempts:"dontInvert"});
        if(res && res.data){
          const code=codeFromQR(res.data);
          if(code){
            input.value=code;
            stopCamera();
            doLookup();
            return;
          }
        }
      }
    }
    rafId=requestAnimationFrame(tick);
  }

  async function startCamera(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      toast("Este navegador no permite usar la cámara","warn"); return;
    }
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}, audio:false});
      video.srcObject=stream;
      await video.play();
      camWrap.style.display="block";
      scanning=true;
      rafId=requestAnimationFrame(tick);
    }catch(e){
      console.error(e);
      if(e && (e.name==="NotAllowedError"||e.name==="PermissionDeniedError")){
        toast("Permiso de cámara denegado. Habilitalo en el navegador.","err");
      } else if(location.protocol!=="https:" && location.hostname!=="localhost"){
        toast("La cámara requiere HTTPS. Abrí el sistema con https://","err");
      } else {
        toast("No se pudo abrir la cámara","err");
      }
    }
  }

  $("#vbCamBtn").onclick=startCamera;
  $("#vbCamClose").onclick=stopCamera;

  // ----- Historial embebido (carga automática + buscador) -----
  let histRows=[];
  let histQuery="";
  const soloSuyas = state.user.rol==="seguridad";

  const histEstadoBadge=(e)=> e==="pendiente"
    ? `<span class="badge-st" style="background:rgba(217,138,31,.16);color:var(--warn)">Pendiente</span>`
    : (e==="vencido"
      ? `<span class="badge-st out" style="background:rgba(192,57,43,.12);color:#b23b2e">Vencido</span>`
      : (e==="vigente"
          ? `<span class="badge-st complete">Vigente</span>`
          : `<span class="badge-st partial">Sin fecha</span>`));
  const histFecha=(iso)=>{
    if(!iso) return "—";
    try{ const d=new Date(iso); const f=d.toLocaleDateString("es-CR");
      let h=d.getHours(), m=String(d.getMinutes()).padStart(2,"0"); const ap=h>=12?"p.m.":"a.m."; h=h%12||12;
      return `${f} ${h}:${m} ${ap}`; }catch(e){ return iso; }
  };

  const paintHist=()=>{
    if(state.view!=="verify") return;
    const list=$("#vbHistList"); if(!list) return;
    const f=histRows.filter(r=>!histQuery ||
      (r.codigo+" "+r.nombre+" "+(r.cedula||"")+" "+(r.verificadoNombre||"")+" "+(r.compania||"")).toLowerCase().includes(histQuery));
    if(histRows.length===0){
      list.innerHTML=`<div class="empty-state sm"><div class="es-ico">${ICON.doc}</div><h3>Sin verificaciones aún</h3><p>Cuando escanees un gafete, quedará registrado acá.</p></div>`;
      return;
    }
    if(f.length===0){ list.innerHTML=`<div class="empty-state sm"><div class="es-ico">${ICON.search}</div><h3>Sin coincidencias</h3></div>`; return; }
    list.innerHTML=`<div class="table-wrap"><table class="tbl">
      <thead><tr>
        <th>Fecha y hora</th><th>Código</th><th>Colaborador</th>
        <th class="hide-sm">Cédula</th><th class="hide-sm">Compañía</th>
        <th>Estado</th>${soloSuyas?'':'<th>Verificó</th>'}
      </tr></thead>
      <tbody>${f.map(r=>`<tr class="${r.estado==='pendiente'?'row-pending':(r.estado==='vencido'?'row-vencido':'')}">
        <td>${esc(histFecha(r.fecha))}</td>
        <td><span class="consec">${esc(r.codigo)}</span></td>
        <td>${esc(r.nombre)}</td>
        <td class="hide-sm">${esc(r.cedula||"—")}</td>
        <td class="hide-sm">${esc(r.compania||"—")}</td>
        <td>${histEstadoBadge(r.estado)}</td>
        ${soloSuyas?'':`<td>${esc(r.verificadoNombre||r.verificadoPor||"—")}</td>`}
      </tr>`).join("")}</tbody>
    </table></div>`;
  };

  async function loadHist(){
    try{ histRows=await dbListVerifications(); }catch(e){ console.error(e); }
    paintHist();
  }

  const histSearch=$("#vbHistSearch");
  if(histSearch) histSearch.addEventListener("input",e=>{ histQuery=e.target.value.toLowerCase(); paintHist(); });

  const histExport=$("#vbHistExport");
  if(histExport) histExport.onclick=()=>{
    if(histRows.length===0){ toast("No hay verificaciones para exportar","warn"); return; }
    const headers=["Fecha y hora","Codigo","Colaborador","Cedula","Puesto","Compania","Estado","Verifico"];
    const csvRows=histRows.map(r=>[
      histFecha(r.fecha), r.codigo, r.nombre, r.cedula||"", r.puesto||"", r.compania||"",
      (r.estado==="vencido"?"Vencido":(r.estado==="vigente"?"Vigente":"Sin fecha")),
      r.verificadoNombre||r.verificadoPor||""
    ]);
    const esc2=(s)=>{ s=String(s==null?"":s); return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
    const csv="\ufeff"+[headers.join(";")].concat(csvRows.map(r=>r.map(esc2).join(";"))).join("\r\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`verificaciones_gafetes_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast("Historial exportado","ok");
  };

  // exponer loadHist para que doLookup refresque el historial tras cada verificación
  window.__reloadVerifyHist = loadHist;
  loadHist();
}

      <div id="scanResult" class="scan-result"></div>

    if(!b){

    }
    box.innerHTML=`
      <div class="scan-hit">
        <div class="sh-photo">${b.foto?`<img src="${b.foto}">`:`<span>${ICON.user}</span>`}</div>
        <div class="sh-info">
          <b>${esc(b.nombre)}</b>
          <span>${ICON.hash} ${esc(b.codigo)}</span>
          <span>Cédula: ${esc(b.cedula)}</span>
          <span>${esc(b.puesto||"—")}</span>
          <span class="sh-comp">${esc(b.compania||"")}</span>
          <div class="sh-dates"><span>Ingreso: <b>${esc(b.fechaIngreso||"—")}</b></span><span>Vence: <b>${esc(b.fechaVence||"—")}</b></span></div>
        </div>
      </div>
      <div class="scan-foot"><button class="btn ghost" onclick="badgeView('${b.id}')">${ICON.eye} Ver gafete</button><button class="btn solid" onclick="badgeEditor(window.__lastScan)">${ICON.edit} Editar</button></div>`;
    window.__lastScan=b;
    input.select();
  };

  input.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); doLookup(); } });
}

  const modal=el("div","modal-bg show");

      <h3>${ICON.badge} ${isNew?"Nuevo gafete":"Editar gafete"}</h3>
      <button class="icon-btn" id="beX">${ICON.close}</button>
    </div>
    <div class="modal-body">
      <div class="badge-editor">
        <div class="be-left">
          <div class="be-photo" id="bePhoto">
            ${b.foto?`<img src="${b.foto}" id="bePhotoImg">`:`<div class="be-photo-empty">${ICON.camera}<span>Sin foto</span></div>`}

          <div class="field-row">
            <div class="field"><label>Cédula *</label><input id="beCedula" value="${esc(b.cedula)}" placeholder="Ej. 304400086"></div>
            <div class="field"><label>Compañía *</label><select id="beCompania">${BADGE_COMPANIES.map(c=>`<option ${c===b.compania?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
          </div>
          <div class="field"><label>Puesto *</label><input id="bePuesto" value="${esc(b.puesto)}" placeholder="Ej. Consultor Soporte TI"></div>
          <div class="field-row">
            <div class="field"><label>Fecha de ingreso</label><input type="date" id="beIngreso" value="${esc(b.fechaIngreso||"")}"></div>
            <div class="field"><label>Fecha de vencimiento</label><input type="date" id="beVence" value="${esc(b.fechaVence||"")}"><small class="fhint">Se calcula solo (ingreso + 10 años); podés cambiarla.</small></div>
          </div>
          <div class="field">
            <label>Código interno</label>
            <input id="beCodigo" value="${esc(b.codigo)}" placeholder="${isNew?"Se genera automáticamente al guardar":""}" ${isNew?"disabled":""}>
            <small class="fhint">${isNew?"El código se asigna solo, según la compañía (BYC-0001 / BC-0001).":"Código fijo; no se modifica."}</small>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="beCancel">Cancelar</button>
      <button class="btn solid" id="beSave">${ICON.check} ${isNew?"Crear gafete":"Guardar cambios"}</button>
    </div></div>`;
  document.body.appendChild(modal);
  const close=()=>modal.remove();
  $("#beX").onclick=close; $("#beCancel").onclick=close;
  modal.addEventListener("mousedown",e=>{if(e.target===modal)close();});

  // carga de foto (redimensionada para no inflar Firestore)
  let fotoData=b.foto||"";
  $("#bePhotoInput").addEventListener("change",e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        // recorte tipo retrato 3:4, máx 480px de alto
        const targetH=480, targetW=360;
        const canvas=document.createElement("canvas");
        canvas.width=targetW; canvas.height=targetH;
        const ctx=canvas.getContext("2d");
        // cubrir manteniendo proporción (object-fit: cover)
        const scale=Math.max(targetW/img.width, targetH/img.height);
        const w=img.width*scale, h=img.height*scale;
        ctx.drawImage(img,(targetW-w)/2,(targetH-h)/2,w,h);
        fotoData=canvas.toDataURL("image/jpeg",0.82);
        $("#bePhoto").innerHTML=`<img src="${fotoData}" id="bePhotoImg">`;
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  const removeBtn=$("#beRemovePhoto");
  if(removeBtn) removeBtn.onclick=()=>{ fotoData=""; $("#bePhoto").innerHTML=`<div class="be-photo-empty">${ICON.camera}<span>Sin foto</span></div>`; };

  // Al cambiar la fecha de ingreso, sugerir vencimiento = ingreso + 10 años.
  // Solo autocompleta si el vencimiento está vacío o si coincidía con el
  // cálculo del ingreso anterior (para no pisar un valor puesto a mano).
  const ingEl=$("#beIngreso"), venEl=$("#beVence");
  if(ingEl && venEl){
    ingEl.addEventListener("change",()=>{
      const prevCalc = addYearsISO(b.fechaIngreso||"", 10);
      if(!venEl.value || venEl.value===prevCalc){
        venEl.value = addYearsISO(ingEl.value, 10);
      }
      b.fechaIngreso = ingEl.value; // actualizar referencia para el próximo cambio
    });
  }

  $("#beSave").onclick=async()=>{
    const nombre=$("#beNombre").value.trim();
    const cedula=$("#beCedula").value.trim();
    const puesto=$("#bePuesto").value.trim();
    const compania=$("#beCompania").value;
    const fechaIngreso=$("#beIngreso").value;
    const fechaVence=$("#beVence").value;
    if(!nombre||!cedula||!puesto){ toast("Completá nombre, cédula y puesto","warn"); return; }

    const btn=$("#beSave"); btn.disabled=true; btn.innerHTML='<span class="spinner sm" style="border-top-color:#fff;border-color:rgba(255,255,255,.4)"></span> Guardando…';
    try{
      if(isNew){
        const codigo=await nextBadgeCode(compania);
        const venceCalc = fechaVence || (fechaIngreso ? addYearsISO(fechaIngreso, 10) : "");
        const nb={nombre,cedula,puesto,compania,fechaIngreso,fechaVence:venceCalc,foto:fotoData,codigo,
                  estado:"activo", creadoPor:state.user.usuario, creadoEn:new Date().toISOString()};
        const saved=await dbCreateBadge(nb);
        close(); toast(`Gafete creado: ${codigo}`,"ok");
        if(window._reloadBadges) await window._reloadBadges();
        badgeView(saved);
      } else {
        const patch={nombre,cedula,puesto,compania,fechaIngreso,fechaVence,foto:fotoData};
        await dbUpdateBadge(b.id,patch);
        close(); toast("Gafete actualizado","ok");
        if(window._reloadBadges) await window._reloadBadges();
      }
    }catch(e){
      console.error(e);
      btn.disabled=false; btn.innerHTML=`${ICON.check} ${isNew?"Crear gafete":"Guardar cambios"}`;
      const msg=(e&&e.message)?e.message:String(e);
      // pistas útiles para el caso más común (reglas de Firestore sin publicar)
      if(/permission|insufficient|PERMISSION_DENIED/i.test(msg)){
        toast("Permiso denegado por Firestore. Falta publicar las reglas de la colección de gafetes.","err");
      } else {
        toast("Error al guardar: "+msg,"err");
      }
    }
  };
}

/* ---------- Vista del gafete (carnet) con QR + impresión ---------- */
async function badgeView(badge){
  if(typeof badge==="string"){ try{ badge=(await dbListBadges()).find(x=>x.id===badge); }catch(e){} }
  if(!badge) return;
  const qr=makeQRDataURL(badgeVerifyURL(badge.codigo), 240);
  const modal=el("div","modal-bg show");
  modal.innerHTML=`<div class="modal"><div class="modal-head">
      <h3>${ICON.badge} Gafete de ${esc(badge.nombre)}</h3>
      <button class="icon-btn" id="bvX">${ICON.close}</button>
    </div>
    <div class="modal-body">
      <div class="badge-preview-wrap">
        ${badgeCardHTML(badge, qr)}
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="bvClose">Cerrar</button>
      <button class="btn solid" id="bvPrint">${ICON.print} Imprimir gafete</button>
    </div></div>`;
  document.body.appendChild(modal);
  const close=()=>modal.remove();
  $("#bvX").onclick=close; $("#bvClose").onclick=close;
  modal.addEventListener("mousedown",e=>{if(e.target===modal)close();});
  $("#bvPrint").onclick=()=>printBadge(badge, qr);
}

function fmtCarnetDate(iso){
  if(!iso) return "—";
  const p=iso.split("-"); // yyyy-mm-dd
  if(p.length===3) return `${p[2]}-${p[1]}-${p[0]}`;
  return iso;
}

/* Suma años a una fecha ISO (yyyy-mm-dd) y devuelve otra fecha ISO.
   Se usa para calcular el vencimiento del carnet a partir del ingreso. */
function addYearsISO(iso, years){
  if(!iso) return "";
  const p=iso.split("-");
  if(p.length!==3) return "";
  let y=parseInt(p[0],10)+years;
  let m=p[1], d=p[2];
  // manejar 29 de febrero -> 28 si el año destino no es bisiesto
  if(m==="02" && d==="29"){
    const bis=(y%4===0 && y%100!==0)||(y%400===0);
    if(!bis) d="28";
  }
  return `${y}-${m}-${d}`;
}

/* URL pública de verificación del gafete. Apunta a la misma página del sistema
   con el parámetro ?gafete=CODIGO, para que al escanear el QR con cualquier
   celular se abra la ficha del carnet. */
function badgeVerifyURL(codigo){
  const base = location.origin + location.pathname;
  return base + "?gafete=" + encodeURIComponent(codigo);
}

/* ¿El gafete está vigente según su fecha de vencimiento? */
function badgeVigente(b){
  if(!b.fechaVence) return null; // sin fecha => no se evalúa
  const hoy = todayISO();
  return b.fechaVence >= hoy;
}

/* ---------- Autoregistro público de carnet (?registro=1) ----------
   Formulario sin login para que el colaborador cree su propio carnet.
   Sube su foto, llena sus datos, y el carnet queda PENDIENTE de aprobación.
   El código interno se asigna automáticamente según la compañía. */
function renderSelfRegister(){
  const boot=$("#bootLoader");
  if(boot){ boot.classList.add("hide"); setTimeout(()=>boot.remove(),400); }
  const app=$("#app");
  app.innerHTML=`<div class="sr-screen"><div class="sr-card" id="srCard">
    <div class="sr-head">
      <img src="${LOGOS.byc}" class="sr-logo">
      <h1>Registro de carnet</h1>
      <p>Completá tus datos y subí tu foto. Tu carnet quedará pendiente de revisión por el Departamento de Sistemas.</p>
    </div>
    <div class="sr-photo-wrap">
      <div class="sr-photo" id="srPhoto"><div class="sr-photo-empty">${ICON.camera}<span>Tocá para subir tu foto</span></div></div>
      <label class="btn ghost sm sr-photo-btn">
        ${ICON.camera} Subir foto
        <input type="file" id="srPhotoInput" accept="image/*" capture="user" style="display:none">
      </label>
    </div>
    <div class="sr-fields">
      <div class="field"><label>Nombre completo *</label><input id="srNombre" placeholder="Nombre y apellidos"></div>
      <div class="field"><label>Cédula *</label><input id="srCedula" placeholder="Ej. 304400086" inputmode="numeric"></div>
      <div class="field"><label>Compañía *</label><select id="srCompania">${BADGE_COMPANIES.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>
      <div class="field"><label>Puesto *</label><input id="srPuesto" placeholder="Ej. Operario de empaque"></div>
      <div class="field"><label>Fecha de ingreso</label><input type="date" id="srIngreso"></div>
    </div>
    <button class="btn solid sr-submit" id="srSubmit">${ICON.check} Enviar registro</button>
    <p class="sr-foot">B&amp;C Exportadores del Valle de Ujarrás</p>
  </div></div>`;

  // foto (redimensionada a 3:4, igual que en el editor interno)
  let fotoData="";
  $("#srPhotoInput").addEventListener("change",e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const targetH=480, targetW=360;
        const canvas=document.createElement("canvas");
        canvas.width=targetW; canvas.height=targetH;
        const ctx=canvas.getContext("2d");
        const scale=Math.max(targetW/img.width, targetH/img.height);
        const w=img.width*scale, h=img.height*scale;
        ctx.drawImage(img,(targetW-w)/2,(targetH-h)/2,w,h);
        fotoData=canvas.toDataURL("image/jpeg",0.82);
        $("#srPhoto").innerHTML=`<img src="${fotoData}">`;
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  $("#srSubmit").onclick=async()=>{
    const nombre=$("#srNombre").value.trim();
    const cedula=$("#srCedula").value.trim();
    const compania=$("#srCompania").value;
    const puesto=$("#srPuesto").value.trim();
    const fechaIngreso=$("#srIngreso").value;
    if(!nombre||!cedula||!puesto){ toast("Completá nombre, cédula y puesto","warn"); return; }
    if(!fotoData){ toast("Subí tu foto para continuar","warn"); return; }

    const btn=$("#srSubmit"); btn.disabled=true;
    btn.innerHTML='<span class="spinner sm" style="border-top-color:#fff;border-color:rgba(255,255,255,.4)"></span> Enviando…';
    try{
      const codigo=await nextBadgeCode(compania);
      const fechaVence = fechaIngreso ? addYearsISO(fechaIngreso, 10) : "";
      const nb={nombre,cedula,puesto,compania,fechaIngreso,fechaVence,foto:fotoData,codigo,
                estado:"pendiente", origen:"autoregistro",
                creadoPor:"autoregistro", creadoEn:new Date().toISOString()};
      await dbCreateBadge(nb);
      // pantalla de éxito
      $("#srCard").innerHTML=`
        <div class="sr-done">
          <div class="sr-done-ico">${ICON.check}</div>
          <h1>¡Registro enviado!</h1>
          <p>Gracias, <b>${esc(nombre)}</b>. Tu carnet quedó registrado y está <b>pendiente de aprobación</b> por el Departamento de Sistemas.</p>
          <div class="sr-done-code">${esc(codigo)}</div>
          <p class="sr-done-hint">Podés cerrar esta ventana.</p>
        </div>`;
    }catch(e){
      console.error(e);
      btn.disabled=false; btn.innerHTML=`${ICON.check} Enviar registro`;
      const msg=(e&&e.message)?e.message:String(e);
      if(/permission|insufficient|PERMISSION_DENIED/i.test(msg)){
        toast("No se pudo enviar (permisos de Firestore).","err");
      } else {
        toast("No se pudo enviar: "+msg,"err");
      }
    }
  };
}

/* Vista PÚBLICA de verificación: se muestra al abrir ?gafete=CODIGO (al escanear
   el QR con el celular). No requiere login; muestra solo datos de verificación. */
async function renderPublicBadge(codigo){
  const boot=$("#bootLoader");
  if(boot){ boot.classList.add("hide"); setTimeout(()=>boot.remove(),400); }
  const app=$("#app");
  app.innerHTML=`<div class="verify-screen"><div class="verify-card"><div class="loader-wrap"><div class="spinner"></div><p>Verificando gafete…</p></div></div></div>`;

  let b=null;
  try{ b=await dbGetBadgeByCode((codigo||"").toUpperCase()); }catch(e){ console.error(e); }

  const wrap=$(".verify-card");
  if(!b){
    wrap.innerHTML=`
      <div class="verify-head"><img src="${LOGOS.byc}" class="verify-logo"></div>
      <div class="verify-status invalid">${ICON.warn}<div><b>Gafete no encontrado</b><span>El código <b>${esc(codigo)}</b> no corresponde a ningún carnet registrado.</span></div></div>
      <a class="btn ghost" href="${location.origin+location.pathname}" style="justify-content:center">Ir al sistema</a>`;
    return;
  }

  const vig = badgeVigente(b);
  const pendiente = (b.estado||"activo")==="pendiente";
  const qr = makeQRDataURL(badgeVerifyURL(b.codigo), 200);
  const statusHtml = pendiente
    ? `<div class="verify-status invalid">${ICON.warn}<div><b>Carnet pendiente</b><span>Aún no ha sido aprobado por el Departamento de Sistemas.</span></div></div>`
    : (vig===null
        ? ""

            ? `<div class="verify-status ok">${ICON.check}<div><b>Carnet vigente</b><span>Válido hasta ${esc(fmtCarnetDate(b.fechaVence))}</span></div></div>`
            : `<div class="verify-status invalid">${ICON.warn}<div><b>Carnet vencido</b><span>Venció el ${esc(fmtCarnetDate(b.fechaVence))}</span></div></div>`));

  wrap.innerHTML=`
    <div class="verify-head"><img src="${LOGOS.byc}" class="verify-logo"></div>
    <div class="verify-photo">${b.foto?`<img src="${b.foto}">`:`<div class="verify-photo-empty">${ICON.user}</div>`}</div>
    <div class="verify-name">${esc(b.nombre)}</div>
    <div class="verify-puesto">${esc(b.puesto||"")}</div>
    <div class="verify-meta">
      <span class="verify-code">${esc(b.codigo)}</span>
      <span class="verify-comp">${esc(b.compania||"")}</span>
    </div>
    ${statusHtml}
    <div class="verify-qr">${qr?`<img src="${qr}">`:''}</div>
    <div class="verify-foot">Verificación de identificación · B&amp;C Exportadores</div>`;
}

    : `background:#ddd`;
  const css=`
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;
      -webkit-print-color-adjust:exact;print-color-adjust:exact}
    html,body{width:100%}
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#eee}
    .carnet{width:5.4cm;min-height:8.6cm;background:#fff;border-radius:10px;padding:.35cm .3cm;

    .carnet-name{font-weight:bold;font-size:12pt;margin-bottom:.05cm;color:#111}
    .carnet-line{font-size:10.5pt;color:#222;line-height:1.35}
    .carnet-line.small{font-size:10pt}
    .carnet-qr{margin-top:.15cm;display:flex;flex-direction:column;align-items:center;gap:2px}
    .carnet-qr img{width:1.9cm;height:1.9cm}
    .carnet-code{font-size:8pt;letter-spacing:.5px;color:#333}
    .carnet-strip{position:absolute;left:0;right:0;bottom:0;height:.28cm;
      background:linear-gradient(90deg,#7ac143,#2e7d32)}
    @media print{
      @page{margin:0}
      body{background:#fff;min-height:auto}
      .carnet{box-shadow:none;border-radius:0}
    }`;
  const cardHTML=`
    <div class="carnet">
      <img class="carnet-logo" src="${LOGOS.byc}" alt="B&amp;C">
      <div class="carnet-photo"></div>
      <div class="carnet-name">${esc(b.nombre)}</div>
      <div class="carnet-line">Ced: ${esc(b.cedula)}</div>
      <div class="carnet-line">${esc(b.puesto||"")}</div>

      <div class="carnet-line small">F.Venc: ${esc(fmtCarnetDate(b.fechaVence))}</div>

  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Gafete ${esc(b.nombre)} - ${esc(b.cedula)}</title><style>${css}</style></head>
    <body>${cardHTML}
    <script>window.onload=function(){setTimeout(function(){window.print();},350);};<\/script>
    </body></html>`);
  win.document.close();
}


function userEditor(user, onDone){
  const isNew=!user;
  const modal=el("div","modal-bg show");
  modal.innerHTML=`
    <div class="modal narrow">
      <div class="modal-head">
        <div class="mh-ico" style="background:${ACCENTS.emerald}">${ICON.user}</div>
        <div><h3>${isNew?'Nuevo usuario':'Editar usuario'}</h3><div class="mh-sub">Cuenta de acceso a SecuDocs</div></div>
        <button class="close" id="ueClose">${ICON.close}</button>
      </div>
      <div class="modal-body">
        <div class="ff" style="margin-bottom:14px"><label>Nombre completo <span class="req">*</span></label>
          <input id="ueName" value="${esc(user?.nombre||'')}" placeholder="Ej: Juan Pérez"></div>
        <div class="ff" style="margin-bottom:14px"><label>Usuario <span class="req">*</span></label>
          <input id="ueUser" value="${esc(user?.usuario||'')}" placeholder="usuario" autocapitalize="none" ${user?'':''}></div>
        <div class="ff" style="margin-bottom:14px"><label>Rol <span class="req">*</span></label>
          <select id="ueRole">
            <option value="seguridad" ${user?.rol==='seguridad'?'selected':''}>Seguridad (crear y completar)</option>
            <option value="encargado" ${user?.rol==='encargado'?'selected':''}>Encargado (acceso total, sin eliminar ni administración)</option>
            <option value="admin" ${user?.rol==='admin'?'selected':''}>Administrador (acceso total)</option>
          </select></div>
        <div class="ff"><label>Contraseña ${isNew?'<span class="req">*</span>':'<span style="font-weight:400;color:var(--muted)">(dejar vacío para no cambiar)</span>'}</label>
          <input id="uePwd" type="password" placeholder="${isNew?'Mínimo 5 caracteres':'••••••••'}"></div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" id="ueCancel">Cancelar</button>
        <button class="btn solid" id="ueSave"><span id="ueLbl">${isNew?'Crear usuario':'Guardar'}</span></button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  const close=()=>modal.remove();
  $("#ueClose").onclick=close; $("#ueCancel").onclick=close;
  modal.addEventListener("mousedown",e=>{if(e.target===modal)close();});
  $("#ueSave").onclick=async()=>{
    const nombre=$("#ueName").value.trim();
    const usuario=$("#ueUser").value.trim().toLowerCase();
    const rol=$("#ueRole").value;
    const pwd=$("#uePwd").value;
    if(!nombre||!usuario){ toast("Completá nombre y usuario","warn"); return; }
    if(isNew && pwd.length<5){ toast("La contraseña debe tener al menos 5 caracteres","warn"); return; }
    if(!isNew && pwd && pwd.length<5){ toast("La contraseña debe tener al menos 5 caracteres","warn"); return; }
    const btn=$("#ueSave"),lbl=$("#ueLbl"); btn.disabled=true;
    lbl.innerHTML='<span class="spinner sm" style="border-top-color:#fff;border-color:rgba(255,255,255,.4)"></span> Guardando…';
    try{
      // unicidad de usuario
      if(isNew || (user && user.usuario!==usuario)){
        const exists=await dbGetUserByName(usuario);
        if(exists){ btn.disabled=false; lbl.textContent=isNew?'Crear usuario':'Guardar'; toast("Ese nombre de usuario ya existe","warn"); return; }
      }
      if(isNew){
        await dbCreateUser({nombre,usuario,rol,pwd:await hashPwd(pwd),creado:todayISO()});
        toast("Usuario creado","ok");
      }else{
        const patch={nombre,usuario,rol};
        if(pwd) patch.pwd=await hashPwd(pwd);
        await dbUpdateUser(user.id,patch);
        toast("Usuario actualizado","ok");
      }
      close();
      if(state.demo) renderUsers(); else if(typeof onDone==="function") onDone();
    }catch(e){ console.error(e); btn.disabled=false; lbl.textContent=isNew?'Crear usuario':'Guardar'; toast("Error al guardar usuario","err"); }
  };
  $("#ueName").focus();
}

/* ======================================================================
   ARRANQUE
   ====================================================================== */
async function boot(){
  if(state.demo) demoLoad();
  opsLoad();

  // Verificación pública de gafete: ?gafete=CODIGO (al escanear el QR)
  const params = new URLSearchParams(location.search);
  const gaf = params.get("gafete");
  if(gaf){
    try{ await ensureSeedAdmin(); }catch(e){}
    await renderPublicBadge(gaf);
    return;
  }

  // Autoregistro público de carnet: ?registro=1 (QR para colaboradores)
  if(params.get("registro")!==null){
    try{ await ensureSeedAdmin(); }catch(e){}
    renderSelfRegister();
    return;
  }

  let seeded=false;
  try{ seeded = await ensureSeedAdmin(); }catch(e){ console.warn("seed:",e); }

  const boot=$("#bootLoader");
  setTimeout(()=>{ boot.classList.add("hide"); setTimeout(()=>boot.remove(),550); }, 700);

  const sess = loadSession();
  if(sess){
    // revalidar que el usuario aún exista
    try{
      const u = await dbGetUserByName(sess.usuario);
      if(u){ state.user={id:u.id,usuario:u.usuario,nombre:u.nombre,rol:u.rol}; renderApp(); return; }
    }catch(e){}
  }
  renderLogin();
  if(seeded && state.demo){
    setTimeout(()=>toast("Modo demo: usuario admin / admin123","info",6000), 1200);
  }
}

document.addEventListener("DOMContentLoaded", boot);
</script>
